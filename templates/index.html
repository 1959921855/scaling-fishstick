<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>语音陪聊 · 小暖</title>

<style>
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:system-ui;
    background:linear-gradient(145deg,#1e2b3c,#0f1a24);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    display:flex;
    width:100%;
    max-width:1400px;
    height:92vh;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    overflow:hidden;
}

/* sidebar */
.sidebar{
    width:300px;
    background:#2c3e4e;
    color:white;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.sessions{
    flex:1;
    overflow:auto;
    padding:10px;
}

.session{
    background:rgba(255,255,255,0.1);
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
}

.session.active{
    background:#3b6eff;
}

/* chat */
.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    background:#f5f6fa;
}

.header{
    background:#2c3e4e;
    color:white;
    padding:14px;
    text-align:center;
}

.msgs{
    flex:1;
    padding:15px;
    overflow:auto;
}

.msg{
    max-width:80%;
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;
}

.user{background:#3b6eff;color:white;margin-left:auto;}
.ai{background:white;}

.input{
    display:flex;
    padding:10px;
    gap:8px;
}

input{
    flex:1;
    padding:10px;
    border-radius:20px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.send{background:#3b6eff;color:white;}
.voice{background:#ff7b5c;color:white;}
</style>
</head>

<body>

<div class="app">

    <div class="sidebar">
        <div class="sidebar-header">
            💬 会话
            <button onclick="newSession()">+新建</button>
        </div>
        <div class="sessions" id="sessions"></div>
    </div>

    <div class="chat">

        <div class="header">🎙️ 小暖语音助手</div>

        <div class="msgs" id="msgs"></div>

        <div class="input">
            <input id="text">
            <button class="send" onclick="send()">发送</button>
        </div>

        <button class="voice" onclick="voice()">🎤 语音</button>

    </div>

</div>

<script>

let sessionId = null;
let audio = null;

/* =======================
   🔥 30秒主动问候系统
======================= */

let idleTimer = null;
let lastActivity = Date.now();

function resetIdleTimer(){
    lastActivity = Date.now();
    clearTimeout(idleTimer);

    idleTimer = setTimeout(()=>{
        triggerGreeting();
    },30000); // 30秒
}

/* 主动问候 */
async function triggerGreeting(){

    // 如果正在说话，不打断
    if(audio && !audio.paused) return;

    const msg = "你好呀，我在这里，有什么想聊的吗？";

    addMsg("ai",msg);

    const tts = await fetch("/chat/text-to-speech",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:msg})
    });

    const data = await tts.json();

    if(data.audio_response){
        audio = new Audio("data:audio/mp3;base64,"+data.audio_response);
        audio.play();
    }

    // 继续下一轮计时（关键）
    resetIdleTimer();
}

/* =======================
   UI工具
======================= */

function addMsg(role,text){
    const div=document.createElement("div");
    div.className="msg "+role;
    div.innerText=text;
    document.getElementById("msgs").appendChild(div);
}

/* =======================
   会话
======================= */

async function newSession(){
    const res=await fetch("/session/new",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({user_id:"web_user",title:"新对话"})
    });

    const data=await res.json();
    sessionId=data.session_id;

    loadSessions();
}

async function loadSessions(){
    const res=await fetch("/sessions/web_user?limit=20");
    const data=await res.json();

    let html="";
    for(let s of data.sessions){
        html+=`<div class="session ${sessionId==s.id?'active':''}"
        onclick="openSession(${s.id})">${s.title}</div>`;
    }

    document.getElementById("sessions").innerHTML=html;
}

async function openSession(id){
    sessionId=id;

    const res=await fetch(`/session/${id}/messages`);
    const data=await res.json();

    document.getElementById("msgs").innerHTML="";

    for(let m of data.messages){
        addMsg(m.role,m.content);
    }

    loadSessions();
}

/* =======================
   发送消息
======================= */

async function send(){

    resetIdleTimer(); // 🔥 用户操作重置计时

    let text=document.getElementById("text").value;
    if(!text) return;

    addMsg("user",text);

    const res=await fetch("/chat/text",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            message:text,
            user_id:"web_user",
            session_id:sessionId
        })
    });

    const data=await res.json();

    addMsg("ai",data.response);

    const tts=await fetch("/chat/text-to-speech",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:data.response})
    });

    const audioData=await tts.json();

    if(audioData.audio_response){
        audio = new Audio("data:audio/mp3;base64,"+audioData.audio_response);
        audio.play();
    }

    resetIdleTimer();
}

/* =======================
   语音（Android + Web）
======================= */

function voice(){
    resetIdleTimer();

    if(window.AndroidSpeech){
        AndroidSpeech.startSpeechRecognition();
    }
    else if(window.webkitSpeechRecognition){
        let r=new webkitSpeechRecognition();
        r.lang="zh-CN";

        r.onresult=(e)=>{
            send(e.results[0][0].transcript);
        };

        r.start();
    }
}

window.onAndroidSpeechResult=function(text){
    send(text);
    resetIdleTimer();
};

/* =======================
   用户活动监听（关键）
======================= */

["click","keydown","touchstart"].forEach(ev=>{
    document.addEventListener(ev,resetIdleTimer);
});

/* =======================
   初始化
======================= */

newSession();
resetIdleTimer();

</script>

</body>
</html>
