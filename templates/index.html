<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小暖陪聊 · WebView 修复</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #1e2b3c 0%, #0f1a24 100%);
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-app {
            width: 100%;
            max-width: 750px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 800px;
        }
        .header {
            background: #2c3e4e;
            color: white;
            padding: 18px 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(248,250,255,0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 24px;
            line-height: 1.45;
        }
        .message.user {
            align-self: flex-end;
            background: #3b6eff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: white;
            color: #1f2a3e;
            border-bottom-left-radius: 4px;
            border: 1px solid #e2e8f0;
        }
        .input-area {
            background: white;
            padding: 16px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid #e9eef3;
        }
        .text-input-row {
            display: flex;
            gap: 12px;
        }
        #textInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 32px;
            font-size: 1rem;
        }
        .send-btn {
            background: #3b6eff;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .voice-btn {
            background: #ff7b5c;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            margin: 0 auto;
        }
        .status {
            font-size: 0.75rem;
            text-align: center;
            color: #2c3e4e;
            background: #eef2f8;
            padding: 6px;
            border-radius: 30px;
        }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
<div class="chat-app">
    <div class="header">🎙️ 小暖 · WebView 修复</div>
    <div class="messages" id="messageBox">
        <div class="message ai">您好，我是小暖。按住下方按钮说话或打字～</div>
    </div>
    <div class="input-area">
        <div class="text-input-row">
            <input type="text" id="textInput" placeholder="输入文字..." autocomplete="off">
            <button class="send-btn" id="sendTextBtn">发送</button>
        </div>
        <button class="voice-btn" id="voiceBtn">🎤 按住说话</button>
        <div class="status" id="statusMsg">✅ 在线 | 支持打断</div>
    </div>
</div>

<script>
(function() {
    const USER_ID = 'web_user';
    let currentSessionId = localStorage.getItem('session_id');
    let currentAudio = null;
    let abortController = null;

    const messageBox = document.getElementById('messageBox');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendTextBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const statusSpan = document.getElementById('statusMsg');

    function stopCurrentAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function addMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerHTML = role === 'user' ? `👤 ${escapeHtml(content)}` : `🤖 ${escapeHtml(content)}`;
        messageBox.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth' });
    }

    async function ensureSession() {
        if (currentSessionId) return currentSessionId;
        try {
            const res = await fetch('/session/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: USER_ID, title: '新对话' })
            });
            const data = await res.json();
            currentSessionId = data.session_id;
            localStorage.setItem('session_id', currentSessionId);
            return currentSessionId;
        } catch (err) {
            console.error('创建会话失败', err);
            return null;
        }
    }

    async function sendMessage(userText) {
        if (!userText.trim()) return;
        stopCurrentAudio();
        if (abortController) abortController.abort();
        abortController = new AbortController();

        addMessage('user', userText);
        textInput.value = '';

        sendBtn.disabled = voiceBtn.disabled = true;
        statusSpan.innerHTML = '🤔 AI 思考中...';

        try {
            let sessionId = currentSessionId;
            if (!sessionId) {
                sessionId = await ensureSession();
                if (!sessionId) throw new Error('无法创建会话');
            }
            const chatRes = await fetch('/chat/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText, user_id: USER_ID, session_id: sessionId }),
                signal: abortController.signal
            });
            const chatData = await chatRes.json();
            const aiText = chatData.response;
            addMessage('ai', aiText);

            const ttsRes = await fetch('/chat/text-to-speech', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: aiText })
            });
            const ttsData = await ttsRes.json();
            if (ttsData.audio_response) {
                stopCurrentAudio();
                const audio = new Audio(`data:audio/mp3;base64,${ttsData.audio_response}`);
                currentAudio = audio;
                audio.play().catch(e => console.warn);
                audio.onended = () => { if (currentAudio === audio) currentAudio = null; };
                statusSpan.innerHTML = '🔊 已播放回复';
            } else {
                statusSpan.innerHTML = '✅ 回复完成';
            }
        } catch (err) {
            if (err.name === 'AbortError') return;
            console.error(err);
            statusSpan.innerHTML = '❌ 网络错误';
            addMessage('ai', '网络连接异常，请重试。');
        } finally {
            sendBtn.disabled = voiceBtn.disabled = false;
            setTimeout(() => { if (statusSpan.innerHTML !== '🔴 正在听...') statusSpan.innerHTML = '✅ 在线 | 支持打断'; }, 2000);
        }
    }

    sendBtn.addEventListener('click', () => sendMessage(textInput.value.trim()));
    textInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(textInput.value.trim()); });

    // ---------- 语音识别（专门修复 WebView 只能识别一次的问题）----------
    let currentRecognition = null;
    let isListening = false;

    function startRecognition() {
        if (isListening) return;
        stopCurrentAudio();

        // 关键：每次重新创建实例，避免状态残留
        if (currentRecognition) {
            try { currentRecognition.abort(); } catch(e) {}
            currentRecognition = null;
        }

        if (!('webkitSpeechRecognition' in window)) {
            statusSpan.innerHTML = '❌ 浏览器不支持语音识别';
            return;
        }

        const recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'zh-CN';

        recognition.onstart = () => {
            isListening = true;
            statusSpan.innerHTML = '🔴 正在听... 松手结束';
            voiceBtn.style.background = '#e55a3e';
        };

        recognition.onend = () => {
            isListening = false;
            voiceBtn.style.background = '#ff7b5c';
            if (!recognition.resultReceived) {
                statusSpan.innerHTML = '⚠️ 未检测到语音，再试试看';
                setTimeout(() => {
                    if (statusSpan.innerHTML === '⚠️ 未检测到语音') 
                        statusSpan.innerHTML = '✅ 在线 | 支持打断';
                }, 2000);
            }
            // 释放引用
            if (currentRecognition === recognition) currentRecognition = null;
        };

        recognition.onresult = async (e) => {
            const text = e.results[0][0].transcript;
            statusSpan.innerHTML = `📝 识别: ${text}`;
            recognition.resultReceived = true;
            await sendMessage(text);
        };

        recognition.onerror = (event) => {
            console.error('识别错误', event.error);
            let msg = '';
            if (event.error === 'no-speech') msg = '没有听到声音';
            else if (event.error === 'audio-capture') msg = '无法获取麦克风权限';
            else if (event.error === 'not-allowed') msg = '麦克风权限被拒绝';
            else msg = '识别出错';
            statusSpan.innerHTML = `❌ ${msg}`;
            voiceBtn.style.background = '#ff7b5c';
            isListening = false;
            if (currentRecognition === recognition) currentRecognition = null;
        };

        currentRecognition = recognition;
        currentRecognition.resultReceived = false;
        currentRecognition.start();
    }

    function stopRecognition() {
        if (currentRecognition && isListening) {
            currentRecognition.stop();
        }
    }

    voiceBtn.addEventListener('mousedown', startRecognition);
    voiceBtn.addEventListener('mouseup', stopRecognition);
    voiceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecognition(); });
    voiceBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecognition(); });

    // 初始化会话
    if (!currentSessionId) ensureSession();
})();
</script>
</body>
</html>
