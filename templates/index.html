<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>语音陪聊 · 会话历史</title>

<style>
/* ====== UI完全保留你的版本 ====== */
* { box-sizing: border-box; }

body {
    font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(145deg, #1e2b3c 0%, #0f1a24 100%);
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app-container {
    display: flex;
    width: 100%;
    max-width: 1400px;
    height: 90vh;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border-radius: 32px;
    overflow: hidden;
}

/* 左侧 */
.sessions-sidebar {
    width: 300px;
    background: rgba(30, 43, 60, 0.85);
    border-right: 1px solid rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* 手机菜单 */
@media(max-width:768px){
    .sessions-sidebar{
        position:absolute;
        left:-85%;
        width:80%;
        height:100%;
        transition:0.3s;
        z-index:999;
    }
    .sessions-sidebar.show{
        left:0;
    }
}

.sessions-header{
    padding:16px;
    background:#2c3e4e;
    color:white;
    display:flex;
    justify-content:space-between;
}

.sessions-list{
    flex:1;
    overflow-y:auto;
    padding:12px;
}

.session-item{
    background:rgba(255,255,255,0.1);
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    color:#e2e8f0;
}

.session-preview{
    font-size:12px;
    color:#aaa;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.delete-session{
    float:right;
    background:transparent;
    border:none;
    color:#ff7b5c;
    cursor:pointer;
}

/* 聊天 */
.chat-area{flex:1;display:flex;flex-direction:column;background:#f8faff;}

.chat-header{
    background:#2c3e4e;
    color:white;
    padding:16px;
    display:flex;
    align-items:center;
    gap:10px;
}

#menuBtn{
    display:none;
}

@media(max-width:768px){
    #menuBtn{display:block;}
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message.user{
    align-self:flex-end;
    background:#3b6eff;
    color:white;
    padding:10px 14px;
    border-radius:20px;
}

.message.ai{
    align-self:flex-start;
    background:white;
    padding:10px 14px;
    border-radius:20px;
}

.input-area{
    padding:14px;
    background:white;
}

.text-input-row{
    display:flex;
    gap:10px;
}

#textInput{
    flex:1;
    padding:10px;
    border-radius:20px;
}

.send-btn{
    background:#3b6eff;
    color:white;
    border:none;
    border-radius:20px;
    padding:10px 16px;
}

.voice-btn{
    width:100%;
    margin-top:10px;
    background:#ff7b5c;
    border:none;
    border-radius:20px;
    padding:12px;
    color:white;
}
</style>
</head>

<body>

<div class="app-container">

<!-- 左侧 -->
<div class="sessions-sidebar">
    <div class="sessions-header">
        💬 历史对话
        <div>
            <button id="menuBtn">☰</button>
            <button id="newSessionBtn">+</button>
        </div>
    </div>

    <div id="sessionsList"></div>
</div>

<!-- 聊天 -->
<div class="chat-area">

<div class="chat-header">🎙️ 小暖 AI</div>

<div class="messages" id="messageBox"></div>

<div class="input-area">
    <div class="text-input-row">
        <input id="textInput">
        <button class="send-btn" id="sendBtn">发送</button>
    </div>
    <button class="voice-btn" id="voiceBtn">🎤 说话</button>
</div>

</div>

</div>

<script>
(function(){

const USER_ID='web_user';
let currentSessionId=null;
let currentAudio=null;

/* =========================
   手机菜单
========================= */
document.getElementById('menuBtn')?.addEventListener('click',()=>{
    document.querySelector('.sessions-sidebar').classList.toggle('show');
});

/* =========================
   🔥 30秒空闲问候
========================= */

let idleTimer=null;
let lastGreeting=0;

const IDLE_TIME=30000;
const COOLDOWN=10*60*1000;

function resetIdleTimer(){
    clearTimeout(idleTimer);
    idleTimer=setTimeout(triggerGreeting,IDLE_TIME);
}

async function triggerGreeting(){
    const now=Date.now();
    if(now-lastGreeting<COOLDOWN) return;
    lastGreeting=now;

    const text="你怎么不说话了？我在呢。";

    addMessage('ai',text);
    playTTS(text);
}

/* ===== 所有操作都重置 ===== */
function bindReset(){
    ['click','keydown','touchstart','scroll'].forEach(e=>{
        document.addEventListener(e,resetIdleTimer,true);
    });
}

/* =========================
   消息 + TTS（完整恢复）
========================= */

function addMessage(role,text){
    const div=document.createElement('div');
    div.className='message '+role;
    div.innerHTML=(role==='user'?'👤 ':'🤖 ')+text;
    document.getElementById('messageBox').appendChild(div);
    document.getElementById('messageBox').scrollTop=999999;
}

async function playTTS(text){
    try{
        const res=await fetch('/chat/text-to-speech',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({text})
        });

        const data=await res.json();

        if(data.audio_response){
            currentAudio=new Audio(`data:audio/mp3;base64,${data.audio_response}`);
            currentAudio.play();
        }
    }catch(e){}
}

/* =========================
   会话（恢复完整）
========================= */

async function loadSessions(){
    const res=await fetch(`/sessions/${USER_ID}?limit=50`);
    const data=await res.json();

    const box=document.getElementById('sessionsList');
    box.innerHTML='';

    data.sessions.forEach(s=>{

        const div=document.createElement('div');
        div.className='session-item';

        div.innerHTML=`
            ${s.title}
            <button class="delete-session">🗑</button>
            <div class="session-preview">${s.preview||''}</div>
        `;

        div.onclick=()=>loadSessionMessages(s.id);

        div.querySelector('.delete-session').onclick=async(e)=>{
            e.stopPropagation();
            await fetch(`/session/${s.id}?user_id=${USER_ID}`,{method:'DELETE'});
            loadSessions();
        };

        box.appendChild(div);
    });
}

async function loadSessionMessages(id){

    const res=await fetch(`/session/${id}/messages`);
    const data=await res.json();

    const box=document.getElementById('messageBox');
    box.innerHTML='';

    data.messages.forEach(m=>{
        addMessage(m.role,m.content);
    });

    currentSessionId=id;

    resetIdleTimer();
}

/* =========================
   发送（完整 + TTS）
========================= */

async function sendMessage(text){

    if(!text.trim()) return;

    resetIdleTimer();

    addMessage('user',text);

    document.getElementById('textInput').value='';

    const res=await fetch('/chat/text',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            message:text,
            user_id:USER_ID,
            session_id:currentSessionId
        })
    });

    const data=await res.json();

    addMessage('ai',data.response);

    playTTS(data.response);
}

/* =========================
   语音（完整恢复）
========================= */

let recognition=null;
let isAndroid=typeof AndroidSpeech!=='undefined';

if('webkitSpeechRecognition'in window && !isAndroid){

    recognition=new webkitSpeechRecognition();
    recognition.lang='zh-CN';

    recognition.onresult=(e)=>{
        sendMessage(e.results[0][0].transcript);
    };

    recognition.onerror=()=>{};
    recognition.onend=()=>{};
}

/* Android */
window.onAndroidSpeechResult=function(text){
    sendMessage(text);
};

document.getElementById('voiceBtn').onclick=()=>{
    resetIdleTimer();

    if(isAndroid){
        AndroidSpeech.startSpeechRecognition();
    }else if(recognition){
        recognition.start();
    }
};

/* =========================
   输入
========================= */

document.getElementById('sendBtn').onclick=()=>{
    sendMessage(document.getElementById('textInput').value);
};

document.getElementById('textInput').onkeydown=(e)=>{
    if(e.key==='Enter'){
        sendMessage(e.target.value);
    }
};

/* =========================
   初始化
========================= */

bindReset();
loadSessions();
resetIdleTimer();

})();
</script>

</body>
</html>
