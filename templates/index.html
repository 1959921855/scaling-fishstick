<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能聊天助手 - 主动问候示例</title>
    <style>
        /* 简单样式，不影响您原有界面，仅供演示 */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .chat-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            background: #2c3e66;
            color: white;
            padding: 16px 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f9fafc;
        }
        .message {
            display: flex;
            max-width: 80%;
        }
        .message.user {
            align-self: flex-end;
        }
        .message.system {
            align-self: flex-start;
        }
        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .user .bubble {
            background: #2c3e66;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .system .bubble {
            background: #e9eef3;
            color: #1e2a3a;
            border-bottom-left-radius: 4px;
        }
        .sender-name {
            font-size: 0.7rem;
            margin-bottom: 4px;
            opacity: 0.7;
        }
        .input-area {
            display: flex;
            padding: 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }
        #messageInput:focus {
            border-color: #2c3e66;
            box-shadow: 0 0 0 2px rgba(44,62,102,0.2);
        }
        #sendBtn {
            background: #2c3e66;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        #sendBtn:hover {
            background: #1e2f4a;
        }
        .tip {
            font-size: 0.75rem;
            color: #5b6e8c;
            text-align: center;
            padding: 10px;
            border-top: 1px solid #e2e8f0;
            background: #f9fafc;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        💬 健康助手（20秒主动问候）
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message system">
            <div class="bubble">您好！发送任意消息后，如果20秒内没有新消息，我会自动问候您。<br>每次发消息都会重置计时器，可以无限次触发问候哦~</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
        <button id="sendBtn">发送</button>
    </div>
    <div class="tip">
        ⏱️ 20秒无操作即主动问候 | 每发一条消息重置时钟
    </div>
</div>

<script>
    // ====================== 配置区域（请按实际情况修改） ======================
    // 1. 您现有的后端发送消息接口地址（POST）
    const SEND_MESSAGE_API = '/api/send-message/';   // 替换为您的真实接口

    // 2. 您现有的主动问候接口地址（POST）
    const GREETING_API = '/api/active-greeting/';     // 替换为您的真实接口

    // 3. 是否需要在请求中携带 CSRF Token（Django 等框架需要）
    const NEED_CSRF = true;   // 如果后端需要 CSRF 保护请设为 true，否则 false

    // 4. 问候延迟时间（毫秒）
    const GREETING_DELAY_MS = 20000;   // 20秒

    // 5. 获取 CSRF Token 的方法（根据您的框架实现，这里是 Django 通用方式）
    function getCsrfToken() {
        const name = 'csrftoken';
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : '';
    }

    // ====================== 核心逻辑（不需要改动，除非适配您的消息显示函数） ======================
    // 全局定时器ID
    let greetingTimer = null;
    // 当前周期是否已经问候过（避免20秒内重复问候）
    let hasGreetedCurrentCycle = false;

    // 显示消息到界面（您可以根据自己现有的消息显示函数替换这里）
    // 本函数不会改变您原有的界面结构，只是添加一条消息气泡
    function appendMessage(sender, text) {
        const container = document.getElementById('chatMessages');
        if (!container) return;

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender === 'user' ? 'user' : 'system'}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (sender === 'user') {
            bubble.innerText = text;
        } else {
            // 系统/助手消息
            bubble.innerText = text;
        }

        messageDiv.appendChild(bubble);
        container.appendChild(messageDiv);
        // 自动滚动到底部
        container.scrollTop = container.scrollHeight;
    }

    // 主动问候函数（调用后端接口）
    async function sendActiveGreeting() {
        if (hasGreetedCurrentCycle) {
            console.log('[主动问候] 本轮已问候过，跳过');
            return;
        }

        try {
            const headers = {
                'Content-Type': 'application/json',
            };
            if (NEED_CSRF) {
                headers['X-CSRFToken'] = getCsrfToken();
            }

            const response = await fetch(GREETING_API, {
                method: 'POST',
                headers: headers,
                credentials: 'same-origin',   // 携带 cookie
            });

            const data = await response.json();

            // 假设后端返回格式为 { greeting: "您好，需要帮助吗？", success: true }
            // 请根据您实际的后端返回结构调整
            let greetingText = null;
            if (data.greeting) {
                greetingText = data.greeting;
            } else if (data.message) {
                greetingText = data.message;
            } else if (data.success && data.content) {
                greetingText = data.content;
            } else {
                // 如果后端没有返回问候文本，使用默认
                greetingText = '您好，请问还需要帮助吗？';
            }

            // 显示问候语
            appendMessage('system', greetingText);
            // 标记本轮已问候，避免20秒内再次触发
            hasGreetedCurrentCycle = true;

        } catch (err) {
            console.error('[主动问候] 调用失败', err);
            // 可选：可以静默失败，不影响主要功能
        }
    }

    // 重置20秒倒计时（核心修复）
    function resetGreetingTimer() {
        if (greetingTimer) {
            clearTimeout(greetingTimer);
            greetingTimer = null;
        }
        // 重置本轮问候标记，允许新的问候周期
        hasGreetedCurrentCycle = false;
        // 启动新的20秒定时器
        greetingTimer = setTimeout(() => {
            sendActiveGreeting();
        }, GREETING_DELAY_MS);
        console.log('[定时器] 已重置，20秒后将主动问候');
    }

    // 用户发送消息（需要集成到您现有的发送函数中）
    async function sendUserMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (message === '') return;

        // 显示用户消息到界面
        appendMessage('user', message);
        input.value = '';
        input.focus();

        // ★★★★★ 关键一行：每次发送消息都重置20秒倒计时 ★★★★★
        resetGreetingTimer();

        // 调用后端发送消息接口（异步，不阻塞重置逻辑）
        try {
            const headers = {
                'Content-Type': 'application/json',
            };
            if (NEED_CSRF) {
                headers['X-CSRFToken'] = getCsrfToken();
            }

            const response = await fetch(SEND_MESSAGE_API, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ content: message }),
                credentials: 'same-origin',
            });

            const result = await response.json();

            // 假设后端返回 { reply: "回复内容" }，请根据您的实际字段调整
            let replyText = null;
            if (result.reply) {
                replyText = result.reply;
            } else if (result.message) {
                replyText = result.message;
            } else if (result.response) {
                replyText = result.response;
            } else {
                // 如果没有回复内容，可以不显示，或者显示默认
                replyText = null;
            }

            if (replyText) {
                appendMessage('system', replyText);
            }
        } catch (err) {
            console.error('[发送消息] 失败', err);
            appendMessage('system', '消息发送失败，请检查网络或后端服务。');
        }
    }

    // 页面退出时清除定时器（可选）
    window.addEventListener('beforeunload', function() {
        if (greetingTimer) {
            clearTimeout(greetingTimer);
        }
    });

    // 初始化：绑定发送事件，并启动第一个20秒倒计时
    window.addEventListener('DOMContentLoaded', function() {
        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('messageInput');

        if (sendBtn) {
            sendBtn.addEventListener('click', sendUserMessage);
        }
        if (msgInput) {
            msgInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendUserMessage();
                }
            });
        }

        // 启动初始倒计时（页面加载后，如果用户一直没有发消息，20秒后也会主动问候）
        resetGreetingTimer();

        // 可选：如果用户点击输入框聚焦时，也可以重置定时器（表示活跃），不需要可以注释
        // msgInput.addEventListener('focus', resetGreetingTimer);
    });
</script>
</body>
</html>
