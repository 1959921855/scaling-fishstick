<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>小暖 · 温暖陪伴</title>
    <style>
        :root {
            --primary: #e07b6e;
            --primary-light: #f7c5bc;
            --primary-soft: #fef2ef;
            --primary-glow: rgba(224,123,110,0.25);
            --bg: #fdf8f5;
            --bg-warm: #f9f3ef;
            --surface: #ffffff;
            --text: #4a3f3b;
            --text-secondary: #8c7f7a;
            --border: #f0e5de;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.02);
            --shadow-lg: 0 16px 32px rgba(0,0,0,0.06);
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 26px;
            --transition: 0.25s cubic-bezier(0.2,0,0,1);
            --font: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            height: 100vh;
            display: flex;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 45;
            display: none;
        }
        .sidebar-overlay.visible { display: block; }

        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            z-index: 50;
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
            position: relative;
        }
        .sidebar.hidden { transform: translateX(-100%); }
        .sidebar-close-btn {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px; height: 36px;
            background: var(--surface);
            border-radius: 50%;
            box-shadow: var(--shadow-md);
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 51;
            border: none;
        }
        .sidebar-header {
            padding: 24px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h2 { font-size: 1.3rem; font-weight: 600; color: var(--text); }
        .new-session-btn {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px var(--primary-glow);
        }
        .session-list { flex: 1; overflow-y: auto; padding: 12px; }
        .session-item {
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-item:hover { background: var(--primary-soft); }
        .session-item.active { background: var(--primary-soft); border-color: var(--primary-light); }
        .session-info { flex: 1; overflow: hidden; }
        .session-title { font-weight: 600; font-size: 0.95rem; }
        .session-preview { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-time { font-size: 0.7rem; color: #bfb3aa; }
        .delete-session-btn {
            background: none; border: none; color: #ccc; font-size: 1.2rem;
            cursor: pointer; padding: 4px 8px; border-radius: 8px; opacity: 0.6;
        }
        .delete-session-btn:hover { background: #fee9e5; color: #c45a4e; }

        .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg); }
        .chat-header {
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }
        .menu-btn {
            font-size: 1.4rem; display: none; width: 40px; height: 40px;
            align-items: center; justify-content: center; border-radius: 12px;
            background: var(--surface); box-shadow: var(--shadow-sm); border: none; cursor: pointer;
        }
        .header-title { font-weight: 600; font-size: 1.1rem; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .interrupt-btn {
            background: #fff6f5; border: 1px solid #ffdbd9; border-radius: 24px;
            padding: 6px 14px; font-size: 0.85rem; font-weight: 500; color: #c45a4e;
            cursor: pointer; display: none; align-items: center; gap: 4px;
        }
        .call-mode-btn {
            background: #f5f1ed; border-radius: 24px; padding: 6px 14px;
            font-size: 0.85rem; font-weight: 500; color: var(--text); border: none; cursor: pointer;
        }
        .call-mode-btn.active { background: #fee9e5; color: #c45a4e; }
        .voice-select {
            padding: 6px 14px; border-radius: 24px; border: 1px solid var(--border);
            background: var(--surface); font-size: 0.85rem; color: var(--text); outline: none;
        }

        .chat-area {
            flex: 1; overflow-y: auto; padding: 24px 20px 100px;
            scroll-behavior: smooth;
            display: flex; flex-direction: column; gap: 18px;
            background: linear-gradient(180deg, var(--bg) 0%, var(--bg-warm) 100%);
            -webkit-overflow-scrolling: touch;
        }
        .message { display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }
        .message-content {
            max-width: 82%; padding: 14px 18px; border-radius: var(--radius-md);
            font-size: 0.95rem; line-height: 1.55; word-break: break-word;
            box-shadow: var(--shadow-sm);
        }
        .user .message-content { background: var(--primary); color: white; border-bottom-right-radius: 8px; }
        .assistant .message-content { background: var(--surface); color: var(--text); border-bottom-left-radius: 8px; }

        .input-container {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 12px 16px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            z-index: 10;
        }
        .input-card {
            background: var(--surface); border-radius: 28px; padding: 6px 10px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04); border: 1px solid var(--border);
            position: relative;
        }
        .input-box {
            flex: 1; border: none; outline: none; font-size: 0.95rem;
            padding: 10px 4px; background: transparent; color: var(--text);
        }
        .voice-btn, .plus-btn, .send-btn {
            height: 42px; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0; border: none; cursor: pointer; font-weight: 500;
        }
        .voice-btn {
            width: 42px; border-radius: 50%; background: #fdefec; color: var(--primary); font-size: 1.15rem;
        }
        .voice-btn.recording { background: #ffe0db; color: #c44a42; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(224,123,110,0.5); }
            70% { box-shadow: 0 0 0 10px rgba(224,123,110,0); }
            100% { box-shadow: 0 0 0 0 rgba(224,123,110,0); }
        }
        .plus-btn {
            width: 42px; border-radius: 50%; background: #f6f1ed; color: var(--text-secondary); font-size: 1.25rem;
        }
        .send-btn {
            padding: 0 22px; border-radius: 24px; background: var(--primary); color: white;
            box-shadow: 0 4px 14px var(--primary-glow); font-size: 0.95rem;
        }
        .plus-menu {
            position: absolute; bottom: 72px; right: 10px; background: var(--surface);
            border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border);
            padding: 8px; display: none; flex-direction: column; gap: 4px; z-index: 20;
        }
        .plus-menu.visible { display: flex; }
        .menu-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 18px;
            border-radius: 14px; font-size: 0.95rem; color: var(--text); cursor: pointer;
            background: transparent; border: none; width: 100%; text-align: left;
        }
        .menu-item:hover { background: #fdf4f1; }
        .image-preview-container {
            display: none; align-items: center; gap: 10px; margin: 0 0 8px 12px;
            background: var(--surface); padding: 6px 14px; border-radius: 20px; width: fit-content;
        }
        .image-preview { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; border: 1px solid var(--border); }
        .remove-image-btn { font-size: 0.8rem; color: #c45a4e; cursor: pointer; font-weight: 500; }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0;
                height: 100vh;
                transform: translateX(-100%);
                z-index: 50;
            }
            .sidebar.visible { transform: translateX(0); }
            .sidebar-close-btn { display: flex; }
            .menu-btn { display: flex; }
            .message-content { max-width: 88%; }
            .chat-area { padding: 16px 12px 100px; }
            .chat-header { padding: 8px 12px; }
            .header-right { gap: 4px; }
            .interrupt-btn, .call-mode-btn { padding: 4px 10px; font-size: 0.78rem; }
            .voice-select { padding: 4px 10px; font-size: 0.78rem; max-width: 90px; }
            .header-title { font-size: 0.95rem; }
            .input-container { padding: 10px 12px 12px; }
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
    <button class="sidebar-close-btn" id="sidebarCloseBtn" onclick="closeSidebar()">✕</button>
    <div class="sidebar-header">
        <h2>✨ 小暖</h2>
        <button class="new-session-btn" onclick="createNewSession()">＋ 新对话</button>
    </div>
    <div class="session-list" id="sessionList"></div>
</div>

<div class="main">
    <div class="chat-header">
        <button class="menu-btn" onclick="openSidebar()">☰</button>
        <div class="header-title">🧣 小暖 · 温暖陪伴</div>
        <div class="header-right">
            <button class="interrupt-btn" id="interruptBtn" onclick="handleInterrupt()">🔇 打断</button>
            <button class="call-mode-btn" id="callBtn" onclick="toggleCallMode()">📞 通话</button>
            <select class="voice-select" id="voiceSelect" onchange="changeVoice()"></select>
        </div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-container">
        <div class="image-preview-container" id="imagePreviewContainer">
            <img class="image-preview" id="imagePreview" src="" alt="预览">
            <span class="remove-image-btn" onclick="removeImage()">✕ 移除</span>
        </div>
        <div class="input-card">
            <button class="voice-btn" id="voiceBtn" onclick="handleVoiceClick()">🎤</button>
            <input type="text" class="input-box" id="userInput" placeholder="和我说点什么吧…" onkeydown="handleKey(event)" autofocus>
            <button class="plus-btn" onclick="togglePlusMenu()">＋</button>
            <button class="send-btn" onclick="sendMessageText()">发送</button>
            <div class="plus-menu" id="plusMenu">
                <button class="menu-item" onclick="handleVoiceClick()"><span>🎤</span> 语音输入</button>
                <button class="menu-item" onclick="toggleCallMode()"><span>📞</span> 语音通话</button>
                <button class="menu-item" onclick="document.getElementById('imageInput').click()"><span>📷</span> 拍照</button>
                <button class="menu-item" onclick="document.getElementById('imageInput').click()"><span>🖼️</span> 相册</button>
            </div>
        </div>
    </div>
    <input type="file" id="imageInput" accept="image/*" capture="environment" style="display:none" onchange="handleImageSelect(event)">
</div>

<script>
(function() {
    const USER_ID = 'web_user';
    let currentSessionId = null;
    let currentAudio = null;
    let currentVoice = localStorage.getItem('preferred_voice') || 'zh-CN-XiaoxiaoNeural';
    let isCallMode = false;
    let waitingForReply = false;
    let callLoopActive = false;

    let selectedImageBase64 = null;
    let greetingTimeout = null;
    let greetingSent = true;

    const messageBox = document.getElementById('chatArea');
    const textInput = document.getElementById('userInput');
    const voiceBtn = document.getElementById('voiceBtn');
    const callBtn = document.getElementById('callBtn');
    const interruptBtn = document.getElementById('interruptBtn');
    const sessionsListDiv = document.getElementById('sessionList');
    const voiceSelect = document.getElementById('voiceSelect');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');

    window.openSidebar = function() {
        sidebar.classList.add('visible');
        sidebarOverlay.classList.add('visible');
        if (window.innerWidth <= 768) {
            sidebarCloseBtn.style.display = 'flex';
        }
    };
    window.closeSidebar = function() {
        sidebar.classList.remove('visible');
        sidebarOverlay.classList.remove('visible');
        sidebarCloseBtn.style.display = 'none';
    };
    window.toggleSidebar = function() {
        if (sidebar.classList.contains('visible')) closeSidebar();
        else openSidebar();
    };

    let vadStream = null;
    let vadAudioContext = null;
    let vadAnalyser = null;
    let vadRunning = false;
    let vadStartDelayActive = false;
    const VAD_THRESHOLD = 40;
    const VAD_INTERRUPT_FRAMES = 5;
    const VAD_SILENCE_FRAMES = 10;
    let vadOverCount = 0;
    let vadSilenceCount = 0;

    async function loadVoices() {
        try {
            const res = await fetch('/voices');
            const data = await res.json();
            voiceSelect.innerHTML = '';
            for (const v of data.voices) {
                const option = document.createElement('option');
                option.value = v.name;
                option.textContent = v.display;
                if (v.name === currentVoice) option.selected = true;
                voiceSelect.appendChild(option);
            }
        } catch(e) { console.error('加载音色失败', e); }
    }
    window.changeVoice = () => {
        currentVoice = voiceSelect.value;
        localStorage.setItem('preferred_voice', currentVoice);
    };

    async function loadSessions() {
        try {
            const res = await fetch(`/sessions/${USER_ID}?limit=50`);
            const data = await res.json();
            const sessions = data.sessions || [];
            if (!sessions.length) {
                sessionsListDiv.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;">暂无对话</div>';
                return;
            }
            let html = '';
            for (const sess of sessions) {
                const date = new Date(sess.updated_at).toLocaleDateString('zh-CN');
                const time = new Date(sess.updated_at).toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
                html += `<div class="session-item ${currentSessionId===sess.id?'active':''}">
                    <div class="session-info" style="flex:1;overflow:hidden;">
                        <div class="session-title">${escapeHtml(sess.title)}</div>
                        <div class="session-preview">${escapeHtml(sess.preview||'')}</div>
                        <div class="session-time">${date} ${time}</div>
                    </div>
                    <button class="delete-session-btn" data-sid="${sess.id}">🗑️</button>
                </div>`;
            }
            sessionsListDiv.innerHTML = html;

            sessionsListDiv.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-session-btn')) return;
                    const sid = parseInt(item.querySelector('.delete-session-btn').getAttribute('data-sid'));
                    if (sid) {
                        openSession(sid);
                        closeSidebar();
                    }
                });
            });

            sessionsListDiv.querySelectorAll('.delete-session-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const sid = parseInt(btn.getAttribute('data-sid'));
                    if (confirm('确定删除此会话吗？')) {
                        await fetch(`/session/${sid}?user_id=${USER_ID}`, { method:'DELETE' });
                        if (currentSessionId === sid) {
                            currentSessionId = null;
                            await createNewSession();
                        } else await loadSessions();
                    }
                });
            });
        } catch(e) { console.error(e); }
    }

    async function openSession(sid) {
        currentSessionId = sid;
        messageBox.innerHTML = '';
        try {
            const res = await fetch(`/session/${sid}/messages`);
            const data = await res.json();
            const messages = data.messages || [];
            for (const msg of messages) addMessage(msg.role, msg.content, false);
            await loadSessions();
            scrollToBottom();
        } catch(e) { console.error(e); }
    }

    async function createNewSession() {
        try {
            const res = await fetch('/session/new', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ user_id:USER_ID, title:'新对话' })
            });
            const data = await res.json();
            currentSessionId = data.session_id;
            messageBox.innerHTML = '';
            greetingSent = false;
            const greeting = '你好呀，我是小暖，有什么可以陪您聊的？';
            addMessage('assistant', greeting);
            await speakText(greeting);
            await loadSessions();
            scrollToBottom();
        } catch(e) { console.error(e); }
    }
    window.createNewSession = createNewSession;

    function addMessage(role, text, speak = true) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${role}`;
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.textContent = text;
        wrapper.appendChild(contentDiv);
        messageBox.appendChild(wrapper);
        scrollToBottom();
    }

    function scrollToBottom() { messageBox.scrollTop = messageBox.scrollHeight; }

    async function startVAD() {
        if (vadRunning) return;
        try {
            vadStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
            vadAudioContext = new AudioContext();
            const source = vadAudioContext.createMediaStreamSource(vadStream);
            vadAnalyser = vadAudioContext.createAnalyser();
            vadAnalyser.fftSize = 256;
            source.connect(vadAnalyser);
            vadRunning = true;
            vadOverCount = 0;
            vadSilenceCount = 0;
            vadStartDelayActive = true;
            setTimeout(() => { vadStartDelayActive = false; }, 300);
            const dataArray = new Uint8Array(vadAnalyser.frequencyBinCount);
            const checkVolume = () => {
                if (!vadRunning) return;
                if (vadStartDelayActive) { requestAnimationFrame(checkVolume); return; }
                vadAnalyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                const avg = sum / dataArray.length;
                if (avg > VAD_THRESHOLD) {
                    vadOverCount++;
                    vadSilenceCount = 0;
                    if (vadOverCount >= VAD_INTERRUPT_FRAMES) { stopVAD(); handleInterrupt(); return; }
                } else { vadOverCount = 0; vadSilenceCount++; }
                requestAnimationFrame(checkVolume);
            };
            requestAnimationFrame(checkVolume);
        } catch (e) { console.error('VAD 启动失败:', e); vadRunning = false; }
    }

    function stopVAD() {
        if (vadStream) { vadStream.getTracks().forEach(t => t.stop()); vadStream = null; }
        if (vadAudioContext) { vadAudioContext.close(); vadAudioContext = null; }
        vadAnalyser = null; vadRunning = false; vadOverCount = 0; vadSilenceCount = 0;
    }

    async function speakText(text, voice = currentVoice) {
        if (!text) return;
        try {
            const res = await fetch('/chat/text-to-speech', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text, voice }) });
            const data = await res.json();
            if (data.audio_response) {
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                const audio = new Audio(`data:audio/mp3;base64,${data.audio_response}`);
                currentAudio = audio;
                updateInterruptBtn(true);
                if (isCallMode) { waitingForReply = true; startVAD(); }
                audio.onended = () => {
                    if (currentAudio !== audio) return;
                    currentAudio = null; updateInterruptBtn();
                    if (isCallMode) { waitingForReply = false; stopVAD(); setTimeout(() => startCallLoop(), 500); }
                };
                audio.onerror = () => {
                    if (currentAudio !== audio) return;
                    currentAudio = null; updateInterruptBtn();
                    if (isCallMode) { waitingForReply = false; stopVAD(); setTimeout(() => startCallLoop(), 500); }
                };
                await audio.play();
            } else if (isCallMode) { waitingForReply = false; startCallLoop(); }
        } catch(e) { console.error('TTS 失败', e); if (isCallMode) startCallLoop(); }
    }

    function updateInterruptBtn(show) {
        interruptBtn.style.display = (show === undefined ? (isCallMode || currentAudio) : show) ? 'flex' : 'none';
    }

    function handleInterrupt() {
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
        stopVAD(); stopListening(); updateInterruptBtn(isCallMode);
        if (isCallMode) startListening();
    }
    window.handleInterrupt = handleInterrupt;
    interruptBtn.addEventListener('click', handleInterrupt);

    let recognition = null, isListening = false;
    function initRecognition() {
        if (recognition) return;
        if ('webkitSpeechRecognition' in window && !isAndroidBridgeReady()) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'zh-CN'; recognition.continuous = true; recognition.interimResults = false;
            recognition.onstart = () => { isListening = true; voiceBtn.classList.add('recording'); voiceBtn.innerHTML = '🔴'; };
            recognition.onend = () => {
                isListening = false; voiceBtn.classList.remove('recording'); voiceBtn.innerHTML = '🎤';
                if (isCallMode && !waitingForReply && !callLoopActive) startCallLoop();
            };
            recognition.onresult = async (e) => { const text = e.results[e.results.length-1][0].transcript; recognition.stop(); await sendMessage(text); };
            recognition.onerror = () => { isListening = false; voiceBtn.classList.remove('recording'); voiceBtn.innerHTML = '🎤'; if (isCallMode && !waitingForReply) startCallLoop(); };
        }
    }

    function isAndroidBridgeReady() { return window.AndroidSpeech && typeof window.AndroidSpeech.startSpeechRecognition === 'function'; }

    function startListening() {
        document.getElementById('plusMenu').classList.remove('visible');
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
        if (recognition && isListening) { try { recognition.stop(); } catch(e) {} isListening = false; }
        if (!recognition && !isAndroidBridgeReady()) initRecognition();
        if (isCallMode) waitingForReply = false;
        if (isAndroidBridgeReady()) { voiceBtn.classList.add('recording'); voiceBtn.innerHTML = '🔴'; window.AndroidSpeech.startSpeechRecognition(); }
        else if (recognition && !isListening) { try { recognition.start(); } catch(e) { console.error(e); } }
    }

    function stopListening() {
        if (isAndroidBridgeReady()) { voiceBtn.classList.remove('recording'); voiceBtn.innerHTML = '🎤'; }
        else if (recognition && isListening) recognition.stop();
    }

    function startCallLoop() {
        if (!isCallMode || callLoopActive || waitingForReply || (recognition && isListening)) return;
        callLoopActive = true; startListening(); callLoopActive = false;
    }

    async function sendMessage(userText) {
        if (!userText.trim()) return;
        if (!currentSessionId) await createNewSession();
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
        if (recognition && isListening) { recognition.stop(); }
        if (isCallMode) waitingForReply = false;
        stopVAD();
        addMessage('user', userText); textInput.value = ''; clearSelectedImage();
        document.getElementById('plusMenu').classList.remove('visible');
        try {
            const chatRes = await fetch('/chat/text', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:userText, user_id:USER_ID, session_id:currentSessionId }) });
            const chatData = await chatRes.json();
            currentSessionId = chatData.session_id;
            addMessage('assistant', chatData.response);
            await speakText(chatData.response, currentVoice);
            greetingSent = false; resetGreetingTimer(); await loadSessions();
        } catch(e) { console.error(e); addMessage('assistant', '抱歉，网络好像不太好，请稍后再试。'); if (isCallMode) startCallLoop(); }
    }

    window.sendMessageText = () => { if (!isCallMode) sendMessage(textInput.value.trim()); };
    function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); if (!isCallMode) sendMessage(textInput.value.trim()); } }
    window.handleKey = handleKey;
    window.handleVoiceClick = () => { if (isRecording()) stopListening(); else if (!isCallMode) startListening(); };
    function isRecording() { return isListening; }

    window.toggleCallMode = function() {
        document.getElementById('plusMenu').classList.remove('visible');
        if (isCallMode) {
            isCallMode = false; callBtn.classList.remove('active'); callBtn.innerHTML = '📞 通话';
            if (recognition && isListening) recognition.stop();
            waitingForReply = false; callLoopActive = false; stopVAD(); updateInterruptBtn(false); resetGreetingTimer();
        } else {
            isCallMode = true; callBtn.classList.add('active'); callBtn.innerHTML = '📞 挂断';
            clearTimeout(greetingTimeout); updateInterruptBtn(true);
            waitingForReply = false; callLoopActive = false; startCallLoop();
        }
    };

    function handleImageSelect(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = e => { selectedImageBase64 = e.target.result; document.getElementById('imagePreview').src = selectedImageBase64; document.getElementById('imagePreviewContainer').style.display = 'flex'; };
        reader.readAsDataURL(file);
    }
    window.handleImageSelect = handleImageSelect;
    window.removeImage = () => { clearSelectedImage(); };
    function clearSelectedImage() { selectedImageBase64 = null; document.getElementById('imagePreviewContainer').style.display = 'none'; document.getElementById('imagePreview').src = ''; document.getElementById('imageInput').value = ''; }

    function addImageMessage(role, base64) {
        const wrapper = document.createElement('div'); wrapper.className = `message ${role}`;
        const contentDiv = document.createElement('div'); contentDiv.className = 'message-content';
        contentDiv.style.padding = '4px'; contentDiv.style.background = 'transparent';
        const img = document.createElement('img'); img.src = base64; img.style.maxWidth = '220px'; img.style.borderRadius = '16px';
        contentDiv.appendChild(img); wrapper.appendChild(contentDiv); messageBox.appendChild(wrapper); scrollToBottom();
    }

    window.togglePlusMenu = () => document.getElementById('plusMenu').classList.toggle('visible');

    const IDLE_SECONDS = 20;
    function resetGreetingTimer() { clearTimeout(greetingTimeout); if (!isCallMode && !greetingSent) greetingTimeout = setTimeout(sendGreeting, IDLE_SECONDS*1000); }

    async function sendGreeting() {
        if (greetingSent || isCallMode || messageBox.querySelectorAll('.message').length===0) return;
        greetingSent = true; clearTimeout(greetingTimeout);
        const greeting = '你好呀，我在这里，有什么想聊的吗？';
        addMessage('assistant', greeting); await speakText(greeting);
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    async function init() {
        await loadVoices(); initRecognition(); await loadSessions();
        if (!currentSessionId) await createNewSession(); else await openSession(currentSessionId);
        resetGreetingTimer();
        document.addEventListener('click', resetGreetingTimer);
        textInput.addEventListener('input', resetGreetingTimer);
    }
    init();
})();
</script>
</body>
</html>
