<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>语音陪聊 · 会话历史</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #1e2b3c 0%, #0f1a24 100%);
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .sessions-sidebar {
            width: 300px;
            background: rgba(30, 43, 60, 0.85);
            border-right: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sessions-header {
            padding: 16px 12px;
            background: #2c3e4e;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .sessions-header span {
            flex-shrink: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .new-session-btn {
            background: #3b6eff;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .session-item {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #e2e8f0;
        }
        .session-item:hover {
            background: rgba(59,110,255,0.4);
        }
        .session-item.active {
            background: #3b6eff;
            color: white;
        }
        .session-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .session-preview {
            font-size: 0.75rem;
            color: #cbd5e1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-time {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .delete-session {
            float: right;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            color: #ff7b5c;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(248,250,255,0.95);
        }
        .chat-header {
            background: #2c3e4e;
            color: white;
            padding: 18px 20px;
            text-align: center;
            font-size: 1.5rem;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 24px;
            line-height: 1.45;
        }
        .message.user {
            align-self: flex-end;
            background: #3b6eff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: white;
            color: #1f2a3e;
            border-bottom-left-radius: 4px;
            border: 1px solid #e2e8f0;
        }
        .input-area {
            background: white;
            padding: 16px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .text-input-row {
            display: flex;
            gap: 12px;
        }
        #textInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 32px;
        }
        .send-btn, .voice-btn {
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .send-btn {
            background: #3b6eff;
            color: white;
        }
        .voice-btn {
            background: #ff7b5c;
            color: white;
            width: 80%;
            margin: 0 auto;
        }
        .status {
            font-size: 0.75rem;
            text-align: center;
            color: #2c3e4e;
        }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sessions-sidebar">
        <div class="sessions-header">
            <span>💬 历史对话</span>
            <button class="new-session-btn" id="newSessionBtn">+ 新对话</button>
        </div>
        <div class="sessions-list" id="sessionsList">加载中...</div>
    </div>
    <div class="chat-area">
        <div class="chat-header">🎙️ 智能语音陪聊 · 小暖</div>
        <div class="messages" id="messageBox">
            <div class="message ai">加载会话中...</div>
        </div>
        <div class="input-area">
            <div class="text-input-row">
                <input type="text" id="textInput" placeholder="输入文字..." autocomplete="off">
                <button class="send-btn" id="sendTextBtn">发送</button>
            </div>
            <button class="voice-btn" id="voiceBtn">🎤 按住 说话</button>
            <div class="status" id="statusMsg">✅ 在线 | 支持打断</div>
        </div>
    </div>
</div>

<script>
(function() {
    const USER_ID = 'web_user';
    let currentSessionId = null;
    let currentAudio = null;

    const messageBox = document.getElementById('messageBox');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendTextBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const statusSpan = document.getElementById('statusMsg');
    const sessionsListDiv = document.getElementById('sessionsList');
    const newSessionBtn = document.getElementById('newSessionBtn');

    function stopCurrentAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function formatTime(timestamp) {
        return new Date(timestamp).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }

    // 加载会话列表
    async function loadSessions() {
        try {
            const res = await fetch(`/sessions/${USER_ID}?limit=50`);
            const data = await res.json();
            const sessions = data.sessions || [];
            if (sessions.length === 0) {
                sessionsListDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">暂无对话，点击“新对话”开始</div>';
                return;
            }
            let html = '';
            for (const sess of sessions) {
                const date = new Date(sess.updated_at).toLocaleDateString('zh-CN');
                const time = new Date(sess.updated_at).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
                html += `
                    <div class="session-item ${currentSessionId === sess.id ? 'active' : ''}" data-session-id="${sess.id}">
                        <div class="session-title">${escapeHtml(sess.title)}</div>
                        <div class="session-preview">${escapeHtml(sess.preview)}</div>
                        <div class="session-time">${date} ${time}</div>
                        <button class="delete-session" data-id="${sess.id}">🗑️</button>
                    </div>
                `;
            }
            sessionsListDiv.innerHTML = html;

            document.querySelectorAll('.delete-session').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const sessionId = btn.getAttribute('data-id');
                    if (confirm('删除此会话及其所有消息？')) {
                        await deleteSession(sessionId);
                    }
                });
            });
            document.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-session')) return;
                    const sid = parseInt(item.getAttribute('data-session-id'));
                    if (sid) loadSessionMessages(sid);
                });
            });
        } catch (err) {
            console.error(err);
            sessionsListDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">加载失败</div>';
        }
    }

    async function deleteSession(sessionId) {
        try {
            const res = await fetch(`/session/${sessionId}?user_id=${USER_ID}`, { method: 'DELETE' });
            if (res.ok) {
                if (currentSessionId === sessionId) {
                    currentSessionId = null;
                    messageBox.innerHTML = '<div class="message ai">对话已删除，请选择或新建会话。</div>';
                }
                await loadSessions();
            } else alert('删除失败');
        } catch (err) { alert('删除失败'); }
    }

    async function loadSessionMessages(sessionId) {
        try {
            const res = await fetch(`/session/${sessionId}/messages`);
            const data = await res.json();
            const messages = data.messages || [];
            messageBox.innerHTML = '';
            if (messages.length === 0) {
                messageBox.innerHTML = '<div class="message ai">暂无消息，开始聊天吧～</div>';
            } else {
                for (const msg of messages) {
                    const div = document.createElement('div');
                    div.className = `message ${msg.role}`;
                    div.setAttribute('data-msg-id', msg.id);
                    div.setAttribute('data-timestamp', msg.timestamp);
                    div.innerHTML = msg.role === 'user' ? `👤 ${escapeHtml(msg.content)}` : `🤖 ${escapeHtml(msg.content)}`;
                    messageBox.appendChild(div);
                }
                if (messageBox.lastChild) messageBox.lastChild.scrollIntoView({ behavior: 'auto' });
            }
            currentSessionId = sessionId;
            await loadSessions();
        } catch (err) {
            console.error(err);
            messageBox.innerHTML = '<div class="message ai">加载消息失败，请刷新重试</div>';
        }
    }

    async function createNewSession() {
        try {
            const res = await fetch('/session/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: USER_ID, title: "新对话" })
            });
            const data = await res.json();
            const newSessionId = data.session_id;
            await loadSessions();
            await loadSessionMessages(newSessionId);
            statusSpan.innerHTML = '✨ 新对话已创建';
            setTimeout(() => statusSpan.innerHTML = '✅ 在线 | 支持打断', 2000);
        } catch (err) {
            alert('创建失败');
        }
    }
    newSessionBtn.addEventListener('click', createNewSession);

    async function sendMessage(userText) {
        if (!userText.trim()) return;
        if (!currentSessionId) {
            await createNewSession();
            if (!currentSessionId) {
                statusSpan.innerHTML = '❌ 请先创建会话';
                return;
            }
        }
        stopCurrentAudio();
        textInput.value = '';
        sendBtn.disabled = voiceBtn.disabled = true;
        statusSpan.innerHTML = '🤔 AI 思考中...';
        try {
            const chatRes = await fetch('/chat/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText, user_id: USER_ID, session_id: currentSessionId })
            });
            const chatData = await chatRes.json();
            const aiText = chatData.response;
            await loadSessionMessages(currentSessionId);
            const ttsRes = await fetch('/chat/text-to-speech', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: aiText })
            });
            const ttsData = await ttsRes.json();
            if (ttsData.audio_response) {
                stopCurrentAudio();
                const audio = new Audio(`data:audio/mp3;base64,${ttsData.audio_response}`);
                currentAudio = audio;
                audio.play().catch(e => console.warn);
                audio.onended = () => { if (currentAudio === audio) currentAudio = null; };
                statusSpan.innerHTML = '🔊 已播放回复';
            } else statusSpan.innerHTML = '✅ 回复完成';
        } catch (err) {
            console.error(err);
            statusSpan.innerHTML = '❌ 网络错误';
        } finally {
            sendBtn.disabled = voiceBtn.disabled = false;
            setTimeout(() => statusSpan.innerHTML = '✅ 在线 | 支持打断', 2000);
        }
    }

    sendBtn.addEventListener('click', () => sendMessage(textInput.value.trim()));
    textInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(textInput.value.trim()); });

    // ---------- 语音识别：每次动态创建实例，修复 Android WebView ----------
    let isListening = false;
    let currentRecognition = null;

    function startListen() {
        if (isListening) return;
        stopCurrentAudio();

        // 销毁之前的实例
        if (currentRecognition) {
            try { currentRecognition.abort(); } catch(e) {}
            currentRecognition = null;
        }

        if (!('webkitSpeechRecognition' in window)) {
            statusSpan.innerHTML = '❌ 浏览器不支持语音识别';
            return;
        }

        const recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'zh-CN';

        recognition.onstart = () => {
            isListening = true;
            statusSpan.innerHTML = '🔴 正在听... 松手结束';
            voiceBtn.style.background = '#e55a3e';
        };

        recognition.onend = () => {
            isListening = false;
            voiceBtn.style.background = '#ff7b5c';
            if (!recognition.resultReceived) {
                statusSpan.innerHTML = '⚠️ 未检测到语音，再试试看';
                setTimeout(() => {
                    if (statusSpan.innerHTML === '⚠️ 未检测到语音')
                        statusSpan.innerHTML = '✅ 在线 | 支持打断';
                }, 2000);
            }
            // 释放引用
            if (currentRecognition === recognition) currentRecognition = null;
        };

        recognition.onresult = async (e) => {
            const text = e.results[0][0].transcript;
            statusSpan.innerHTML = `📝 识别: ${text}`;
            recognition.resultReceived = true;
            await sendMessage(text);
        };

        recognition.onerror = (event) => {
            console.error('识别错误', event.error);
            let msg = '';
            if (event.error === 'no-speech') msg = '没有听到声音';
            else if (event.error === 'audio-capture') msg = '无法获取麦克风权限';
            else if (event.error === 'not-allowed') msg = '麦克风权限被拒绝';
            else msg = '识别出错';
            statusSpan.innerHTML = `❌ ${msg}`;
            voiceBtn.style.background = '#ff7b5c';
            isListening = false;
            if (currentRecognition === recognition) currentRecognition = null;
        };

        currentRecognition = recognition;
        currentRecognition.resultReceived = false;
        currentRecognition.start();
    }

    function stopListen() {
        if (currentRecognition && isListening) {
            currentRecognition.stop();
        }
    }

    voiceBtn.addEventListener('mousedown', startListen);
    voiceBtn.addEventListener('mouseup', stopListen);
    voiceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startListen(); });
    voiceBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopListen(); });

    loadSessions();
})();
</script>
</body>
</html>
